<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101426">
<title>VIZHI STATUS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Tamil",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#4f46e544,transparent 35%),
    radial-gradient(circle at 90% 20%,#06b6d444,transparent 35%),
    #090d18;
  color:#fff;
  min-height:100vh;
  padding-bottom:40px;
}

.app{
  max-width:700px;
  margin:auto;
}

header{
  text-align:center;
  padding:28px 16px 18px;
}

.logo{
  font-size:52px;
}

h1{
  font-size:30px;
  margin-top:4px;
}

.subtitle{
  color:#bfc7da;
  margin-top:7px;
  font-size:16px;
}

.nav{
  display:flex;
  gap:8px;
  padding:8px 12px;
  overflow-x:auto;
}

.nav button{
  flex:1;
  min-width:90px;
  border:0;
  border-radius:14px;
  padding:13px 10px;
  background:#171d31;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.nav button.active{
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
}

.section{
  display:none;
  padding:12px;
}

.section.active{
  display:block;
}

.card{
  background:#12182aee;
  border:1px solid #2d3854;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 12px 30px #0005;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

textarea,
select,
input{
  width:100%;
  border:1px solid #39445f;
  background:#080c16;
  color:#fff;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

button.main{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
}

button.green{
  background:linear-gradient(135deg,#10b981,#22c55e);
}

button.blue{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
}

button.pink{
  background:linear-gradient(135deg,#ec4899,#f43f5e);
}

button:active{
  transform:scale(.98);
}

.preview{
  width:100%;
  aspect-ratio:9/16;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  position:relative;
  overflow:hidden;
  margin-top:15px;
  box-shadow:0 15px 35px #0007;
}

.previewText{
  font-size:28px;
  font-weight:800;
  line-height:1.5;
  text-shadow:0 3px 12px #0009;
  word-break:break-word;
}

.watermark{
  position:absolute;
  bottom:18px;
  left:0;
  right:0;
  text-align:center;
  font-size:13px;
  opacity:.7;
}

.theme1{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.theme2{
  background:linear-gradient(135deg,#141e30,#243b55);
}

.theme3{
  background:linear-gradient(135deg,#11998e,#38ef7d);
}

.theme4{
  background:linear-gradient(135deg,#654ea3,#eaafc8);
}

.theme5{
  background:linear-gradient(135deg,#fc466b,#3f5efb);
}

.theme6{
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

video,
audio{
  width:100%;
  border-radius:18px;
  margin-top:10px;
}
